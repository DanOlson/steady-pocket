<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/icon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121613" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A budgeting application" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Steady Pocket</title>
    <script>
      // Apply a persisted theme choice before first paint to avoid a flash
      // of the wrong scheme. Kept in sync by the ThemeToggle component.
      (function () {
        var theme = localStorage.getItem('steady-pocket-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
        }
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
